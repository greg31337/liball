name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore raw.slnx
      - run: dotnet build raw.slnx --configuration Release --no-restore
      - run: dotnet test tests/raw.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet pack src/raw.csproj --configuration Release --no-build --no-restore --output artifacts
