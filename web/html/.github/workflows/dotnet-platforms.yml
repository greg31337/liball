name: .NET 10 platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Arm64
            os: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore html.slnx

      - name: Test Release build
        run: dotnet test html.slnx --configuration Release --no-restore

      - name: Verify generated tables
        run: dotnet run --project tools/GenerateTables --configuration Release --no-restore -- --check
